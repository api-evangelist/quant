openapi: 3.2.0
info:
  title: Overledger Server Contracts API
  description: The Overledger Server is the primary client-facing gateway.
  version: 1.0.0
servers:
- url: https://fusion-rollup.quant.dev
  description: Testnet (live) — the public Fusion Server endpoint
- url: http://localhost:8080
  description: Local development
security:
- bearerAuth: []
- apiKeyAuth: []
tags:
- name: Contracts
  description: Deployed smart contract registry and permissions
paths:
  /deployed-contracts/{contractAddress}:
    get:
      tags:
      - Contracts
      summary: Get contract details
      parameters:
      - $ref: '#/components/parameters/contractAddressParam'
      responses:
        '200':
          description: Contract details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployedContract'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: getDeployedContractsByContractAddress
      x-operation-id-source: derived
    put:
      tags:
      - Contracts
      summary: Update contract visibility
      parameters:
      - $ref: '#/components/parameters/contractAddressParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - visibility
              properties:
                visibility:
                  $ref: '#/components/schemas/ContractVisibility'
      responses:
        '200':
          description: Updated contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployedContract'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: putDeployedContractsByContractAddress
      x-operation-id-source: derived
  /deployed-contracts/{contractAddress}/permissions:
    get:
      tags:
      - Contracts
      summary: List permissions for a contract
      parameters:
      - $ref: '#/components/parameters/contractAddressParam'
      responses:
        '200':
          description: Permissions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContractPermission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: getDeployedContractsByContractAddressPermissions
      x-operation-id-source: derived
    post:
      tags:
      - Contracts
      summary: Grant permission to a user for a permissioned contract
      parameters:
      - $ref: '#/components/parameters/contractAddressParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - userId
              properties:
                userId:
                  type: string
                alias:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Permission granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractPermission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: postDeployedContractsByContractAddressPermissions
      x-operation-id-source: derived
    delete:
      tags:
      - Contracts
      summary: Revoke permission from a user for a contract
      parameters:
      - $ref: '#/components/parameters/contractAddressParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - userId
              properties:
                userId:
                  type: string
      responses:
        '200':
          description: Permission revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: deleteDeployedContractsByContractAddressPermissions
      x-operation-id-source: derived
components:
  schemas:
    EvmAddress:
      type: string
      pattern: ^0x[a-fA-F0-9]{40}$
      example: '0xAbCd1234AbCd1234AbCd1234AbCd1234AbCd1234'
    StandardError:
      type: object
      required:
      - timestamp
      - status
      - error
      - message
      - path
      properties:
        timestamp:
          type: integer
          description: Milliseconds since epoch
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
      example:
        timestamp: 1709737845000
        status: 400
        error: Bad request
        message: Validation failed
        path: /users/me/deposits
    ContractVisibility:
      type: string
      enum:
      - PUBLIC
      - PERMISSIONED
      - PRIVATE
    DeployedContract:
      type: object
      required:
      - deployerId
      - address
      - name
      - type
      - visibility
      - createdAt
      - updatedAt
      properties:
        deployerId:
          type: string
        address:
          $ref: '#/components/schemas/EvmAddress'
        name:
          type: string
        type:
          type: string
        visibility:
          $ref: '#/components/schemas/ContractVisibility'
        whitelistedContractIds:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ContractPermission:
      type: object
      required:
      - userId
      - contractAddress
      - createdAt
      - updatedAt
      properties:
        userId:
          type: string
        contractAddress:
          $ref: '#/components/schemas/EvmAddress'
        alias:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    Unauthorized:
      description: Unauthorized — missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
  parameters:
    contractAddressParam:
      name: contractAddress
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EvmAddress'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'A Keycloak access token (JWT), verified against the realm JWKS

        (signature / issuer / expiry). The caller''s identity is the token''s

        `sub` claim — this is **not** a `clientId`.

        '
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'An Overledger-issued API key of the form `fk_<keyId>.<secret>`, minted via

        `POST /users/me/api-keys`. Accepted on any route and **takes precedence**

        over the `Authorization` header when both are supplied. Resolves to the

        same identity (Keycloak `sub`) as the equivalent Bearer JWT.

        '
