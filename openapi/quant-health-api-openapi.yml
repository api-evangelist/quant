openapi: 3.2.0
info:
  title: Overledger Server Health API
  description: The Overledger Server is the primary client-facing gateway.
  version: 1.0.0
servers:
- url: https://fusion-rollup.quant.dev
  description: Testnet (live) — the public Fusion Server endpoint
- url: http://localhost:8080
  description: Local development
security:
- bearerAuth: []
- apiKeyAuth: []
tags:
- name: Health
  description: Liveness and readiness probes
paths:
  /health:
    get:
      tags:
      - Health
      summary: Liveness check
      security: []
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  runtimeVersion:
                    type: string
                    description: The Flow App runtime version that Overledger is running.
                    example: 1.0.0
                  supportedSdkVersions:
                    type: array
                    description: The Flow App SDK versions this runtime accepts.
                    items:
                      type: string
                    example:
                    - 1.0.0
                    - 1.1.0
      operationId: getHealth
      x-operation-id-source: derived
  /ready:
    get:
      tags:
      - Health
      summary: Readiness check
      description: Checks MongoDB connectivity.
      security: []
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  checks:
                    type: object
                    properties:
                      mongo:
                        type: string
                        example: connected
        '503':
          description: Service unavailable (MongoDB disconnected)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: unavailable
                  checks:
                    type: object
                    properties:
                      mongo:
                        type: string
                        example: disconnected
      operationId: getReady
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'A Keycloak access token (JWT), verified against the realm JWKS

        (signature / issuer / expiry). The caller''s identity is the token''s

        `sub` claim — this is **not** a `clientId`.

        '
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'An Overledger-issued API key of the form `fk_<keyId>.<secret>`, minted via

        `POST /users/me/api-keys`. Accepted on any route and **takes precedence**

        over the `Authorization` header when both are supplied. Resolves to the

        same identity (Keycloak `sub`) as the equivalent Bearer JWT.

        '
