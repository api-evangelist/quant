openapi: 3.2.0
info:
  title: Overledger Server Flow Query API
  description: The Overledger Server is the primary client-facing gateway.
  version: 1.0.0
servers:
- url: https://fusion-rollup.quant.dev
  description: Testnet (live) — the public Fusion Server endpoint
- url: http://localhost:8080
  description: Local development
security:
- bearerAuth: []
- apiKeyAuth: []
tags:
- name: Flow Query
  description: Read-only state queries against Flow Apps
paths:
  /flow/apps/{appId}/query/{queryId}:
    get:
      tags:
      - Flow Query
      operationId: queryAppState
      summary: Execute a read-only query against a Flow App
      description: 'Queries app-scoped state without starting a session. The `queryId` must match a

        query handler registered by the app via `app.query(id, handler)`.'
      parameters:
      - name: appId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: queryId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-zA-Z0-9_-]+$
      responses:
        '200':
          description: Query result
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    description: Query-specific response payload defined by the Flow App
        '400':
          $ref: '#/components/responses/FlowBadRequest'
        '401':
          $ref: '#/components/responses/FlowUnauthorized'
        '404':
          $ref: '#/components/responses/FlowNotFound'
components:
  schemas:
    ProblemDetails:
      type: object
      description: RFC 7807 Problem Details — used by all /flow/* endpoints
      required:
      - type
      - title
      - status
      - detail
      - retryable
      properties:
        type:
          type: string
          description: Error classification URI
          example: urn:fusion:error:bad-request
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: appId is required
        retryable:
          type: boolean
          description: Whether the client should retry this request
        instance:
          type: string
          description: Request ID for correlation
  responses:
    FlowBadRequest:
      description: Bad request (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:fusion:error:bad-request
            title: Bad Request
            status: 400
            detail: appId is required
            retryable: false
    FlowUnauthorized:
      description: Unauthorized (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:fusion:error:unauthorized
            title: Unauthorized
            status: 401
            detail: Invalid client credentials
            retryable: false
    FlowNotFound:
      description: Not found (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:fusion:error:not-found
            title: Not Found
            status: 404
            detail: Session not found
            retryable: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'A Keycloak access token (JWT), verified against the realm JWKS

        (signature / issuer / expiry). The caller''s identity is the token''s

        `sub` claim — this is **not** a `clientId`.

        '
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'An Overledger-issued API key of the form `fk_<keyId>.<secret>`, minted via

        `POST /users/me/api-keys`. Accepted on any route and **takes precedence**

        over the `Authorization` header when both are supplied. Resolves to the

        same identity (Keycloak `sub`) as the equivalent Bearer JWT.

        '
