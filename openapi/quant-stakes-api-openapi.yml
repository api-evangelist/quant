openapi: 3.2.0
info:
  title: Overledger Server Stakes API
  description: The Overledger Server is the primary client-facing gateway.
  version: 1.0.0
servers:
- url: https://fusion-rollup.quant.dev
  description: Testnet (live) — the public Fusion Server endpoint
- url: http://localhost:8080
  description: Local development
security:
- bearerAuth: []
- apiKeyAuth: []
tags:
- name: Stakes
  description: Staking operations
paths:
  /stakes:
    post:
      tags:
      - Stakes
      summary: Record a QNT stake transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - txHash
              - network
              properties:
                txHash:
                  $ref: '#/components/schemas/TxHash'
                network:
                  type: string
      responses:
        '201':
          description: Stake recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stake'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: postStakes
      x-operation-id-source: derived
  /stakes/address:
    get:
      tags:
      - Stakes
      summary: Get the QNT staking address for this user
      responses:
        '200':
          description: Staking address
          content:
            application/json:
              schema:
                type: object
                properties:
                  stakeAddress:
                    $ref: '#/components/schemas/EvmAddress'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: getStakesAddress
      x-operation-id-source: derived
components:
  schemas:
    EvmAddress:
      type: string
      pattern: ^0x[a-fA-F0-9]{40}$
      example: '0xAbCd1234AbCd1234AbCd1234AbCd1234AbCd1234'
    Stake:
      type: object
      required:
      - txHash
      - network
      - status
      - amount
      - createdAt
      - updatedAt
      properties:
        txHash:
          $ref: '#/components/schemas/TxHash'
        network:
          type: string
        status:
          type: string
        amount:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StandardError:
      type: object
      required:
      - timestamp
      - status
      - error
      - message
      - path
      properties:
        timestamp:
          type: integer
          description: Milliseconds since epoch
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
      example:
        timestamp: 1709737845000
        status: 400
        error: Bad request
        message: Validation failed
        path: /users/me/deposits
    TxHash:
      type: string
      pattern: ^0x[a-fA-F0-9]{64}$
      example: '0xabcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890ab'
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    Unauthorized:
      description: Unauthorized — missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'A Keycloak access token (JWT), verified against the realm JWKS

        (signature / issuer / expiry). The caller''s identity is the token''s

        `sub` claim — this is **not** a `clientId`.

        '
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'An Overledger-issued API key of the form `fk_<keyId>.<secret>`, minted via

        `POST /users/me/api-keys`. Accepted on any route and **takes precedence**

        over the `Authorization` header when both are supplied. Resolves to the

        same identity (Keycloak `sub`) as the equivalent Bearer JWT.

        '
