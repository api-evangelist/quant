openapi: 3.0.3
info:
  title: Overledger Server
  description: "The Overledger Server is the primary client-facing gateway.\nIt handles authentication, JSON-RPC proxying to connected networks, smart contract permission\nmanagement, Flow App session orchestration, and user/node/network management.\n\n## Authentication\nRequests authenticate with **either** of two credentials, checked in this order:\n\n- **`X-API-Key` header** — an API key of the form\n  `fk_<keyId>.<secret>`. Accepted on any route and **takes precedence** over\n  the `Authorization` header when both are present.\n- **`Authorization: Bearer <jwt>`** — a Keycloak access token, verified\n  against the realm JWKS. The caller's identity is the token's `sub` claim.\n\nBoth paths resolve to the same canonical identity, so a\ntransaction submitted via `/rpc/{apiKey}` and a query made with a Bearer JWT\nfor the same user land on the same records. The `/rpc/{apiKey}` endpoint\nadditionally accepts an API key as the URL path segment, for\nwallet/ethers clients that cannot set request\
    \ headers.\n\n## Flow Endpoints\nRoutes under `/flow/` return RFC 7807 Problem Details for errors\n(`Content-Type: application/problem+json`).\n\n## x402 Payment Settlement (Permit2)\n\nFlow Apps may declare a `payment` field on a step. When present, the client\nmust obtain payment terms and submit a signed Permit2 proof. End-to-end:\n\n1. **Discover the server spender.** When a session reaches a payment step,\n   the rendered `StepSpec` exposes an `X402Descriptor` (returned as the\n   `X-Payment-Required` header on `402 Payment Required`, and discoverable\n   via the app's `/metadata`). The `spender` field is the app's\n   settlement wallet — clients must approve this address in Permit2.\n2. **Sign Permit2 off-chain.** The client signs a Permit2 `SignatureTransfer`\n   authorising the spender to pull `amountAtomicUnits` of `tokenAddress` on\n   `networkId`, with a nonce and deadline.\n3. **Submit with `X-Payment`.** The client POSTs `submitStep` with the\n   base64-encoded payment proof\
    \ in the `X-Payment` header, plus an\n   `Idempotency-Key` (proofs are idempotent per session+key).\n4. **Settlement on-chain.** The app invokes Permit2 from the\n   server spender, pulling the tokens to the descriptor `recipient`. The\n   receipt is returned in the `200` response body as\n   `paymentReceipt` (see [`X402SettlementReceipt`](#/components/schemas/X402SettlementReceipt))\n   and in the `X-Payment-Response` header (base64-encoded JSON of the same).\n5. **Failure modes.** Validation problems (bad signature, expired deadline,\n   insufficient allowance, descriptor mismatch) return `400`. On-chain\n   execution failures (revert, nonce exhausted, RPC errors) return `502`.\n   Both retain RFC 7807 Problem Details semantics.\n\n## App-Scoped Persistent State\n\nEach Flow App can persist a JSON document of state per user. State is\n**scoped to `(appId, userId)`** — there is no cross-user sharing; one user\ncannot see another user's state, even within the same app. State persists\n\
    across sessions (it outlives any single session's TTL) and is mutated by\nthe app's step handlers via patch operations.\n\nClients read app state in two ways:\n\n- **Indirectly inside a `StepSpec`** — fields and tables may carry a\n  `dataRef` such as `\"$appState.connections\"`. Overledger resolves the\n  reference for the calling user before sending the spec to the client.\n  Select / radio-group fields may additionally carry `submitResolve`,\n  which expands the chosen option back into its full record on submission\n  (see the `StepField` schema).\n- **Directly via app-defined queries** — the app registers query handlers\n  and the client calls\n  [`GET /flow/apps/{appId}/query/{queryId}`](#/paths/~1flow~1apps~1%7BappId%7D~1query~1%7BqueryId%7D/get).\n  The query handler is the app's chance to shape, filter, or paginate\n  whatever it stores. There is no generic `/appState` CRUD endpoint —\n  state is only reachable through the spec/query indirection.\n\n## Content Safety\n\nAll user-visible\
    \ strings in a `StepSpec` are scanned by Overledger\nbefore being returned to the client, and rejected step specs surface as\n`502 Bad Gateway` with an RFC 7807 Problem Details body. Two filter\nlayers run on every render and submit:\n\n- **Base contract patterns** — built into the SDK and enforced\n  identically by Overledger.\n- **Operator-defined patterns** — additional literal strings configured\n  per deployment via the `CONTENT_FILTER_EXTRA_PATTERNS` environment\n  variable on Overledger.\n\n**Banned content categories:**\n\n- Prompt-injection attempts\n- Credential-harvesting language\n- HTML / script / iframe injection and inline event handlers\n- Unicode spoofing (e.g. right-to-left override, zero-width characters)\n- Profanity and slurs\n- and more\n\nThe specific patterns are intentionally not published. App authors should\ntreat any `502` whose detail mentions \"content rejected\" as a content\nfilter rejection and revise the offending copy.\n"
  version: 1.0.0
servers:
- url: https://fusion-rollup.quant.dev
  description: Testnet (live) — the public Fusion Server endpoint
- url: http://localhost:8080
  description: Local development
security:
- bearerAuth: []
- apiKeyAuth: []
paths:
  /accounts/subscribe/{address}:
    post:
      tags:
      - Tracker Address
      operationId: subscribeAddress
      summary: Subscribe to events involving an address
      parameters:
      - name: address
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EvmAddress'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackerSubscribeRequest'
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressSubscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /accounts/unsubscribe/{subscriptionId}:
    delete:
      tags:
      - Tracker Address
      operationId: unsubscribeAddress
      summary: Cancel an address subscription
      parameters:
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
      responses:
        '200':
          description: Unsubscribed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsubscribeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /accounts/{address}/events:
    get:
      tags:
      - Tracker Address
      operationId: listAddressEvents
      summary: List recorded events for an address
      parameters:
      - name: address
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EvmAddress'
      - name: networkId
        in: query
        schema:
          type: string
      - name: since
        in: query
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      responses:
        '200':
          description: Address events
          content:
            application/json:
              schema:
                type: object
                required:
                - address
                - count
                - data
                properties:
                  address:
                    $ref: '#/components/schemas/EvmAddress'
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrackerEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /deployed-contracts/{contractAddress}:
    get:
      tags:
      - Contracts
      summary: Get contract details
      parameters:
      - $ref: '#/components/parameters/contractAddressParam'
      responses:
        '200':
          description: Contract details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployedContract'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Contracts
      summary: Update contract visibility
      parameters:
      - $ref: '#/components/parameters/contractAddressParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - visibility
              properties:
                visibility:
                  $ref: '#/components/schemas/ContractVisibility'
      responses:
        '200':
          description: Updated contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployedContract'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /deployed-contracts/{contractAddress}/permissions:
    get:
      tags:
      - Contracts
      summary: List permissions for a contract
      parameters:
      - $ref: '#/components/parameters/contractAddressParam'
      responses:
        '200':
          description: Permissions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContractPermission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Contracts
      summary: Grant permission to a user for a permissioned contract
      parameters:
      - $ref: '#/components/parameters/contractAddressParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - userId
              properties:
                userId:
                  type: string
                alias:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Permission granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractPermission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
      - Contracts
      summary: Revoke permission from a user for a contract
      parameters:
      - $ref: '#/components/parameters/contractAddressParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - userId
              properties:
                userId:
                  type: string
      responses:
        '200':
          description: Permission revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /deposits:
    post:
      tags:
      - Deposits
      operationId: createDeposit
      summary: Create a deposit record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDepositRequest'
      responses:
        '201':
          description: Deposit created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deposit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /deposits/allowance:
    get:
      tags:
      - Deposits
      operationId: getDepositAllowance
      summary: Get token deposit allowances for a wallet
      parameters:
      - name: walletAddress
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/EvmAddress'
      - name: token
        in: query
        required: true
        schema:
          type: string
      - name: network
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Allowance result
          content:
            application/json:
              schema:
                type: object
                required:
                - walletAddress
                - token
                - network
                - allowance
                properties:
                  walletAddress:
                    $ref: '#/components/schemas/EvmAddress'
                  token:
                    type: string
                  network:
                    type: string
                  allowance:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /deposits/balances:
    get:
      tags:
      - Deposits
      operationId: getDepositBalances
      summary: Get token deposit balances for a wallet
      parameters:
      - name: walletAddress
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/EvmAddress'
      responses:
        '200':
          description: Balances per token
          content:
            application/json:
              schema:
                type: object
                required:
                - walletAddress
                - balances
                properties:
                  walletAddress:
                    $ref: '#/components/schemas/EvmAddress'
                  balances:
                    type: array
                    items:
                      type: object
                      required:
                      - token
                      - balance
                      - decimals
                      properties:
                        token:
                          type: string
                        balance:
                          type: string
                        decimals:
                          type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /deposits/{id}:
    get:
      tags:
      - Deposits
      operationId: getDeposit
      summary: Get a deposit by ID
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deposit detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deposit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /deposits/{id}/status:
    get:
      tags:
      - Deposits
      operationId: checkDepositStatus
      summary: Refresh + return a deposit's on-chain status
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Latest status snapshot
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - status
                - lastStatusCheckAt
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    enum:
                    - initiated
                    - l1_pending
                    - l1_confirmed
                    - l2_confirmed
                    - failed
                    - unknown
                  txHash:
                    type: string
                  lastStatusCheckAt:
                    type: string
                    format: date-time
                  failureReason:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /events/subscribe:
    post:
      tags:
      - Tracker Event
      operationId: subscribeEvent
      summary: Subscribe to a specific contract event signature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - contractAddress
              - eventName
              - eventParams
              - callbackUrl
              - networkId
              properties:
                contractAddress:
                  $ref: '#/components/schemas/EvmAddress'
                eventName:
                  type: string
                eventParams:
                  type: array
                  items:
                    type: object
                    required:
                    - type
                    properties:
                      type:
                        type: string
                      value:
                        type: string
                      indexed:
                        type: boolean
                callbackUrl:
                  type: string
                  format: uri
                networkId:
                  type: string
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSubscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /events/subscriptions/{subscriptionId}/events:
    get:
      tags:
      - Tracker Event
      operationId: listEventSubscriptionEvents
      summary: List recorded events for a contract-event subscription
      parameters:
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
      - name: networkId
        in: query
        schema:
          type: string
      - name: since
        in: query
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      responses:
        '200':
          description: Subscription events
          content:
            application/json:
              schema:
                type: object
                required:
                - subscriptionId
                - count
                - data
                properties:
                  subscriptionId:
                    type: string
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrackerEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /events/unsubscribe/{subscriptionId}:
    delete:
      tags:
      - Tracker Event
      operationId: unsubscribeEvent
      summary: Cancel a contract-event subscription
      parameters:
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
      responses:
        '200':
          description: Unsubscribed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsubscribeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /flow/apps/{appId}/events:
    get:
      tags:
      - Flow Webhooks
      operationId: replayEvents
      summary: List / replay webhook events for a Flow App
      description: 'Returns persisted webhook events for the app. Supports cursor-based pagination

        with `after` (eventId) and optional `eventType` filtering.

        '
      parameters:
      - name: appId
        in: path
        required: true
        schema:
          type: string
      - name: eventType
        in: query
        schema:
          type: string
        description: Filter by event type
      - name: after
        in: query
        schema:
          type: string
        description: Cursor — return events after this eventId
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Paginated events
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - hasMore
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookEvent'
                  hasMore:
                    type: boolean
        '401':
          $ref: '#/components/responses/FlowUnauthorized'
        '404':
          $ref: '#/components/responses/FlowNotFound'
  /flow/apps/{appId}/query/{queryId}:
    get:
      tags:
      - Flow Query
      operationId: queryAppState
      summary: Execute a read-only query against a Flow App
      description: 'Queries app-scoped state without starting a session. The `queryId` must match a

        query handler registered by the app via `app.query(id, handler)`.

        '
      parameters:
      - name: appId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: queryId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-zA-Z0-9_-]+$
      responses:
        '200':
          description: Query result
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    description: Query-specific response payload defined by the Flow App
        '400':
          $ref: '#/components/responses/FlowBadRequest'
        '401':
          $ref: '#/components/responses/FlowUnauthorized'
        '404':
          $ref: '#/components/responses/FlowNotFound'
  /flow/apps/{appId}/subscriptions:
    post:
      tags:
      - Flow Webhooks
      operationId: createSubscription
      summary: Subscribe to webhook events for a Flow App
      description: 'Creates a webhook subscription. Events matching `eventType` will be delivered

        to `targetUrl` with HMAC-SHA256 signature validation using the provided `secret`.

        The `targetUrl` must not resolve to a private/loopback IP (SSRF protection).

        '
      parameters:
      - name: appId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - eventType
              - targetUrl
              - secret
              properties:
                eventType:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: ^[a-zA-Z0-9._-]+$
                  description: Event type to subscribe to (e.g. "contact.requested", "step_submitted")
                targetUrl:
                  type: string
                  format: uri
                  description: HTTPS URL to receive webhook deliveries (no private IPs)
                secret:
                  type: string
                  minLength: 16
                  description: Shared secret for HMAC-SHA256 signature verification
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '400':
          $ref: '#/components/responses/FlowBadRequest'
        '401':
          $ref: '#/components/responses/FlowUnauthorized'
        '404':
          $ref: '#/components/responses/FlowNotFound'
    get:
      tags:
      - Flow Webhooks
      operationId: listSubscriptions
      summary: List webhook subscriptions for a Flow App
      parameters:
      - name: appId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Subscriptions list
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookSubscription'
        '401':
          $ref: '#/components/responses/FlowUnauthorized'
        '404':
          $ref: '#/components/responses/FlowNotFound'
  /flow/apps/{appId}/subscriptions/{subscriptionId}:
    delete:
      tags:
      - Flow Webhooks
      operationId: deleteSubscription
      summary: Delete a webhook subscription
      parameters:
      - name: appId
        in: path
        required: true
        schema:
          type: string
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Subscription deleted
        '401':
          $ref: '#/components/responses/FlowUnauthorized'
        '404':
          $ref: '#/components/responses/FlowNotFound'
  /flow/registry/apps:
    get:
      tags:
      - Flow Registry
      operationId: listApps
      summary: List available Flow Apps
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Paginated app list
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FlowAppSummary'
                  pagination:
                    $ref: '#/components/schemas/FlowPaginationMeta'
        '401':
          $ref: '#/components/responses/FlowUnauthorized'
  /flow/registry/apps/components:
    get:
      tags:
      - Flow Registry
      operationId: getAllowedComponents
      summary: List allowed UI component types
      description: Returns the catalogue of allowed template types, field types, and action types.
      responses:
        '200':
          description: Allowed component catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowedComponents'
        '401':
          $ref: '#/components/responses/FlowUnauthorized'
  /flow/registry/apps/{appId}:
    get:
      tags:
      - Flow Registry
      operationId: getApp
      summary: Get a Flow App's details and versions
      parameters:
      - name: appId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: App detail with version history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowAppDetail'
        '401':
          $ref: '#/components/responses/FlowUnauthorized'
        '404':
          $ref: '#/components/responses/FlowNotFound'
  /flow/sessions:
    post:
      tags:
      - Flow Sessions
      operationId: createSession
      summary: Create a new Flow App session
      description: 'Starts a new session for the specified Flow App. Optionally target a specific

        app version and/or a declared start step (multi-start-step apps).

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - appId
              properties:
                appId:
                  type: string
                  minLength: 1
                  description: ID of the Flow App to instantiate
                version:
                  type: string
                  minLength: 1
                  description: Semver version. Defaults to latest active version.
                launchContext:
                  type: object
                  additionalProperties: true
                  description: Arbitrary context passed to the app's start step render
                startStepId:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: ^[a-zA-Z0-9_-]+$
                  description: 'Entry point step ID. Must be a declared start step when the app declares any. Defaults to the app''s first declared start step.

                    '
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
