      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordFinalizeTxRequest'
      responses:
        '200':
          description: The updated withdrawal record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /withdrawals/{id}/prove-tx:
    post:
      tags:
      - Withdrawals
      operationId: recordProveTx
      summary: Record the L1 prove transaction hash for a withdrawal
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordProveTxRequest'
      responses:
        '200':
          description: The updated withdrawal record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /withdrawals/{id}/status:
    get:
      tags:
      - Withdrawals
      operationId: checkWithdrawalStatus
      summary: Refresh and return a withdrawal's current status
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: The withdrawal record with refreshed status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'A Keycloak access token (JWT), verified against the realm JWKS

        (signature / issuer / expiry). The caller''s identity is the token''s

        `sub` claim — this is **not** a `clientId`.

        '
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'An Overledger-issued API key of the form `fk_<keyId>.<secret>`, minted via

        `POST /users/me/api-keys`. Accepted on any route and **takes precedence**

        over the `Authorization` header when both are supplied. Resolves to the

        same identity (Keycloak `sub`) as the equivalent Bearer JWT.

        '
  schemas:
    JsonRpcRequest:
      type: object
      required:
      - jsonrpc
      - method
      - id
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        method:
          type: string
          example: eth_blockNumber
        id:
          oneOf:
          - type: string
            nullable: true
          - type: integer
            nullable: true
          example: 1
        params:
          type: array
          items: {}
          example: []
    JsonRpcResponse:
      type: object
      required:
      - jsonrpc
      - id
      - result
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id:
          oneOf:
          - type: string
            nullable: true
          - type: integer
            nullable: true
        result: {}
    JsonRpcError:
      type: object
      required:
      - jsonrpc
      - id
      - error
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id:
          oneOf:
          - type: string
            nullable: true
          - type: integer
            nullable: true
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: integer
              description: 'Auth-related JSON-RPC error codes returned by `/rpc/{apiKey}`:

                - `-32000`: "Missing credentials." (HTTP 401)

                - `-32001`: "Invalid credentials." (HTTP 403)

                - `-32002`: "Internal server error." (HTTP 500)

                '
            message:
              type: string
    StandardError:
      type: object
      required:
      - timestamp
      - status
      - error
      - message
      - path
      properties:
        timestamp:
          type: integer
          description: Milliseconds since epoch
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
      example:
        timestamp: 1709737845000
        status: 400
        error: Bad request
        message: Validation failed
        path: /users/me/deposits
    EvmAddress:
      type: string
      pattern: ^0x[a-fA-F0-9]{40}$
      example: '0xAbCd1234AbCd1234AbCd1234AbCd1234AbCd1234'
    ContractVisibility:
      type: string
      enum:
      - PUBLIC
      - PERMISSIONED
      - PRIVATE
    DeployedContract:
      type: object
      required:
      - deployerId
      - address
      - name
      - type
      - visibility
      - createdAt
      - updatedAt
      properties:
        deployerId:
          type: string
        address:
          $ref: '#/components/schemas/EvmAddress'
        name:
          type: string
        type:
          type: string
        visibility:
          $ref: '#/components/schemas/ContractVisibility'
        whitelistedContractIds:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PaginatedMeta:
      type: object
      required:
      - total
      - page
      - pageSize
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        hasMore:
          type: boolean
    DltType:
      type: string
      enum:
      - EVM
      - HEDERA
      - SOLANA
      - SUI
      - APTOS
      - COSMOS
    Node:
      type: object
      required:
      - _id
      - userId
      - address
      - dlt
      - createdAt
      - updatedAt
      properties:
        _id:
          type: string
        userId:
          type: string
        address:
          type: string
          format: uri
        network:
          type: string
        name:
          type: string
        dlt:
          $ref: '#/components/schemas/DltType'
        networkId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ResetPolicy:
      oneOf:
      - type: object
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - manual
      - type: object
        required:
        - type
        - hour
        properties:
          type:
            type: string
            enum:
            - daily
          hour:
            type: integer
            minimum: 0
            maximum: 23
      - type: object
        required:
        - type
        - dayOfMonth
        properties:
          type:
            type: string
            enum:
            - monthly
          dayOfMonth:
            type: integer
            minimum: 1
            maximum: 28
    Provider:
      type: object
      required:
      - _id
      - userId
      - name
      - url
      - resetPolicy
      - status
      - createdAt
      - updatedAt
      properties:
        _id:
          type: string
        userId:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri
        resetPolicy:
          $ref: '#/components/schemas/ResetPolicy'
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TxHash:
      type: string
      pattern: ^0x[a-fA-F0-9]{64}$
      example: '0xabcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890ab'
    Stake:
      type: object
      required:
      - txHash
      - network
      - status
      - amount
      - createdAt
      - updatedAt
      properties:
        txHash:
          $ref: '#/components/schemas/TxHash'
        network:
          type: string
        status:
          type: string
        amount:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OffsetPagination:
      type: object
      required:
      - page
      - pageSize
      - total
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    Swap:
      type: object
      required:
      - id
      - userId
      - tokenIn
      - tokenOut
      - amountIn
      - amountOutEstimated
      - amountOutMin
      - slippageBps
      - routeTokens
      - encodedPath
      - walletAddress
      - status
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
        userId:
          type: string
        tokenIn:
          type: string
        tokenOut:
          type: string
        amountIn:
          type: string
        amountOutEstimated:
          type: string
        amountOutMin:
          type: string
        amountOutActual:
          type: string
        slippageBps:
          type: integer
        routeTokens:
          type: array
          items:
            type: string
        encodedPath:
          type: string
        walletAddress:
          $ref: '#/components/schemas/EvmAddress'
        txHash:
          type: string
        status:
          type: string
          enum:
          - initiated
          - completed
          - failed
          - unknown
        failureReason:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    L1Network:
      type: string
      enum:
      - ETH_MAINNET
      - SEPOLIA
      - OPTIMISM
      - OPTIMISM_SEPOLIA
      - ARBITRUM_ONE
      - ARBITRUM_SEPOLIA
    TokenSymbol:
      type: string
      enum:
      - USDT
      - USDC
      - DAI
      - WETH
      - WBTC
      description: Supported bridge tokens (non-exhaustive)
    Deposit:
      type: object
      required:
      - id
      - fromNetwork
      - token
      - amount
      - fromAddress
      - toAddress
      - status
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
        fromNetwork:
          $ref: '#/components/schemas/L1Network'
        token:
          $ref: '#/components/schemas/TokenSymbol'
        amount:
          type: string
        fromAddress:
          $ref: '#/components/schemas/EvmAddress'
        toAddress:
          $ref: '#/components/schemas/EvmAddress'
        txHash:
          $ref: '#/components/schemas/TxHash'
        approvalTxHash:
          $ref: '#/components/schemas/TxHash'
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateDepositRequest:
      type: object
      required:
      - fromNetwork
      - token
      - amount
      - fromAddress
      - toAddress
      properties:
        fromNetwork:
          $ref: '#/components/schemas/L1Network'
        token:
          $ref: '#/components/schemas/TokenSymbol'
        amount:
          type: string
          description: Positive number as string
          example: '100.00'
        fromAddress:
          $ref: '#/components/schemas/EvmAddress'
        toAddress:
          $ref: '#/components/schemas/EvmAddress'
        txHash:
          $ref: '#/components/schemas/TxHash'
        approvalTxHash:
          $ref: '#/components/schemas/TxHash'
    ContractPermission:
      type: object
      required:
      - userId
      - contractAddress
      - createdAt
      - updatedAt
      properties:
        userId:
          type: string
        contractAddress:
          $ref: '#/components/schemas/EvmAddress'
        alias:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AddNodeRequest:
      type: object
      required:
      - address
      - dlt
      properties:
        address:
          type: string
          format: uri
          description: 'Node RPC URL from an approved provider domain (alchemy.com, infura.io,

            quiknode.pro, chainstack.com, getblock.io, blockdaemon.com, ankr.com,

            drpc.live). Must include an API key in the path.

            '
        network:
          type: string
        name:
          type: string
        dlt:
          $ref: '#/components/schemas/DltType'
    Network:
      type: object
      required:
      - networkId
      - name
      - type
      - isFusion
      - createdAt
      - updatedAt
      properties:
        _id:
          type: string
        networkId:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/DltType'
        environment:
          type: string
          enum:
          - mainnet
          - testnet
          - devnet
        visibility:
          type: string
          enum:
          - public
          - permissioned
          - private
        status:
          type: string
          enum:
          - active
          - paused
          - deprecated
        capacity:
          type: string
          enum:
          - PROVISIONED
          - ENHANCED
          - SCALED
        isFusion:
          type: boolean
        rpc:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProblemDetails:
      type: object
      description: RFC 7807 Problem Details — used by all /flow/* endpoints
      required:
      - type
      - title
      - status
      - detail
      - retryable
      properties:
        type:
          type: string
          description: Error classification URI
          example: urn:fusion:error:bad-request
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: appId is required
        retryable:
          type: boolean
          description: Whether the client should retry this request
        instance:
          type: string
          description: Request ID for correlation
    SessionStatus:
      type: string
      enum:
      - active
      - complete
      - expired
    TemplateType:
      type: string
      enum:
      - form
      - review
      - info
      - document
    FieldType:
      type: string
      enum:
      - text-input
      - text-area
      - number
      - currency
      - select
      - checkbox
      - date
      - radio-group
      - display
      - table
      - wallet
    ActionType:
      type: string
      enum:
      - submit
    ActionStyle:
      type: string
      enum:
      - primary
      - secondary
      - danger
    DisplayFormat:
      type: string
      enum:
      - text
      - currency
      - date
      - percentage
    RiskLevel:
      type: string
      enum:
      - safe
      - caution
      - irreversible
    ScreenSpec:
      type: object
      required:
      - template
      properties:
        template:
          $ref: '#/components/schemas/TemplateType'
        title:
          type: string
        description:
          type: string
        icon:
          type: string
    SelectOption:
      type: object
      required:
      - value
      - label
      properties:
        value:
          type: string
        label:
          type: string
    TableColumn:
      type: object
      required:
      - key
      - label
      properties:
        key:
          type: string
        label:
          type: string
        format:
          $ref: '#/components/schemas/DisplayFormat'
    WalletConfig:
      type: object
      required:
      - action
      properties:
        action:
          type: string
        chains:
          type: array
          items:
            type: string
        message:
          type: string
        transaction:
          type: object
          additionalProperties: true
    StepField:
      type: object
      required:
      - id
      - type
      properties:
        id:
          type: string
          minLength: 1
        type:
          $ref: '#/components/schemas/FieldType'
        label:
          type: string
        placeholder:
          type: string
        required:
          type: boolean
        defaultValue: {}
        minLength:
          type: integer
          minimum: 0
        maxLength:
          type: integer
          minimum: 1
        pattern:
          type: string
        rows:
          type: integer
          minimum: 1
        min:
          oneOf:
          - type: number
          - type: string
        max:
          oneOf:
          - type: number
          - type: string
        step:
          type: number
        currencyCode:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/SelectOption'
        defaultChecked:
          type: boolean
        value: {}
        format:
          $ref: '#/components/schemas/DisplayFormat'
        dataRef:
          type: string
        submitResolve:
          type: string
          description: 'For `select` / `radio-group` fields whose options are sourced from

            `$appState`. On submit, Overledger replaces the chosen option''s

            `value` with the full underlying record from app state before

            invoking the step handler. Format mirrors `dataRef`

            (e.g. `"$appState.connections"`); the handler receives the object

            at that path keyed by the selected option, not just the option id.

            '
        columns:
          type: array
          items:
            $ref: '#/components/schemas/TableColumn'
        rowsData:
          type: array
          items:
            type: object
            additionalProperties: true
        emptyMessage:
          type: string
        limit:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        config:
          $ref: '#/components/schemas/WalletConfig'
      description: 'Field schema is polymorphic on `type`. Not all properties apply to every type:

        - text-input / text-area: placeholder, required, minLength, maxLength, pattern, rows (text-area only)

        - number / currency: required, min, max, step, currencyCode (currency only)

        - select / radio-group: required, options, dataRef, submitResolve, limit

        - checkbox: required, defaultChecked

        - date: required, min (ISO date string), max (ISO date string)

        - display: value, format, dataRef

        - table: columns (required), rowsData, emptyMessage, dataRef, limit, pageSize

        - wallet: config (required)

        '
    StepAction:
      type: object
      required:
      - id
      - type
      - label
      properties:
        id:
          type: string
          minLength: 1
        type:
          $ref: '#/components/schemas/ActionType'
        label:
          type: string
          minLength: 1
        style:
          $ref: '#/components/schemas/ActionStyle'
        disabled:
          type: boolean
        confirmationMessage:
          type: string
    StepMessage:
      type: object
      required:
      - text
      properties:
        text:
          type: string
        type:
          type: string
          enum:
          - info
          - warning
          - error
          - success
    BusinessValidationError:
      type: object
      required:
      - fieldId
      - message
      properties:
        fieldId:
          type: string
        code:
          type: string
        message:
          type: string
    AgentMeta:
      type: object
      properties:
        hint:
          type: string
          description: LLM-optimised description of this step's purpose
        emits:
          type: array
          items:
            type: string
          description: Webhook event type IDs this step may emit
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
        outputQuery:
          type: string
          description: Query ID to read the resulting state after this step
        idempotent:
          type: boolean
          description: Whether this step is safe to retry without side-effects
    StepPayment:
      type: object
      required:
      - amountAtomicUnits
      - currency
      - chain
      - recipient
      properties:
        amountAtomicUnits:
          type: string
          pattern: ^\d+$
          description: Positive integer string in smallest denomination (e.g. "5000000" for 5 USDC)
        currency:
          type: string
          example: USDC
        chain:
          type: string
          example: base
        recipient:
          $ref: '#/components/schemas/EvmAddress'
        description:
          type: string
        actions:
          type: array
          items:
            type: string
          description: Action IDs that require payment. Defaults to all submit actions.
        tokenAddress:
          $ref: '#/components/schemas/EvmAddress'
    X402SettlementReceipt:
      type: object
      required:
      - txHash
      - chainId
      - blockNumber
      - settledAt
      properties:
        txHash:
          type: string
        chainId:
          type: integer
        blockNumber:
          type: integer
        settledAt:
          type: string
          format: date-time
    StepSpec:
      type: object
      required:
      - id
      - screen
      - fields
      - actions
      properties:
        id:
          type: string
          minLength: 1
        screen:
          $ref: '#/components/schemas/ScreenSpec'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/StepField'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/StepAction'
        message:
          oneOf:
          - type: string
          - $ref: '#/components/schemas/StepMessage'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/BusinessValidationError'
        agent:
          $ref: '#/components/schemas/AgentMeta'
        payment:
          $ref: '#/components/schemas/StepPayment'
        entryPoint:
          type: boolean
          description: Set by Overledger when this step is a declared session entry point
    HypermediaLinks:
      type: object
      properties:
        self:
          type: string
        submit:
          type: string
    SessionResponse:
      type: object
      required:
      - sessionId
      - appId
      - appVersion
      - status
      - stepSpec
      - stateVersion
      - complete
      - _links
      properties:
        sessionId:
          type: string
        appId:
          type: string
        appVersion:
          type: string
        status:
          $ref: '#/components/schemas/SessionStatus'
        stepSpec:
          $ref: '#/components/schemas/StepSpec'
        stateVersion:
          type: integer
          minimum: 1
        complete:
          type: boolean
        _links:
          $ref: '#/components/schemas/HypermediaLinks'
        paymentReceipt:
          $ref: '#/components/schemas/X402SettlementReceipt'
          description: Present only when x402 Permit2 payment was settled during submit
    SessionListItem:
      type: object
      required:
      - sessionId
      - appId
      - appVersion
      - status
      - currentStepId
      - createdAt
      - updatedAt
      properties:
        sessionId:
          type: string
        appId:
          type: string
        appVersion:
          type: string
        status:
          $ref: '#/components/schemas/SessionStatus'
        currentStepId:
          type: string
        startStepId:
          type: string
          description: The step this session started on (absent for pre-multi-start sessions)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FlowPaginationMeta:
      type: object
      required:
      - hasMore
      - totalCount
      properties:
        nextCursor:
          type: string
        hasMore:
          type: boolean
        totalCount:
          type: integer
    X402Descriptor:
      type: object
      required:
      - version
      - scheme
      - networkId
      - amountAtomicUnits
      - currency
      - recipient
      properties:
        version:
          type: string
          enum:
          - '1'
        scheme:
          type: string
          enum:
          - evm
        networkId:
          type: string
        amountAtomicUnits:
          type: string
        currency:
          type: string
        recipient:
          type: string
        description:
          type: string
        tokenAddress:
          type: string
        permit2Address:
          type: string
        spender:
          type: string
          description: Settlement wallet address (server spender)
    AppVisibility:
      type: string
      enum:
      - public
      - permissioned
      - private
    FlowAppSummary:
      type: object
      required:
      - appId
      - displayName
      - description
      - publisher
      - visibility
      - categories
      - activeVersionCount
      - createdAt
      - updatedAt
      properties:
        appId:
          type: string
        displayName:
          type: string
        description:
          type: string
        publisher:
          type: string
        visibility:
          $ref: '#/components/schemas/AppVisibility'
        categories:
          type: array
          items:
            type: string
        activeVersionCount:
          type: integer
        latestVersion:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        _links:
          $ref: '#/components/schemas/HypermediaLinks'
    AllowedComponents:
      type: object
      required:
      - templates
      - fieldTypes
      - actionTypes
      properties:
        templates:
          type: array
          items:
            type: string
          example:
          - form
          - review
          - info
          - document
        fieldTypes:
          type: array
          items:
            type: string
          example:
          - text-input
          - text-area
          - number
          - currency
          - select
          - checkbox
          - date
          - radio-group
          - display
          - table
          - wallet
        actionTypes:
          type: array
          items:
            type: string
          example:
          - submit
    VersionStatus:
      type: string
      enum:
      - active
      - deprecated
      - retired
    AppType:
      type: string
      enum:
      - internal
      - external
    FlowAppDetail:
      type: object
      required:
      - appId
      - displayName
      - description
      - publisher
      - visibility
      - categories
      - versions
      - createdAt
      - updatedAt
      properties:
        appId:
          type: string
        displayName:
          type: string
        description:
          type: string
        publisher:
          type: string
        visibility:
          $ref: '#/components/schemas/AppVisibility'
        categories:
          type: array
          items:
            type: string
        versions:
          type: array
          items:
            type: object
            required:
            - version
            - status
            - appType
            - createdAt
            - updatedAt
            properties:
              version:
                type: string
              status:
                $ref: '#/components/schemas/VersionStatus'
              appType:
                $ref: '#/components/schemas/AppType'
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        _links:
          $ref: '#/components/schemas/HypermediaLinks'
    WebhookSubscription:
      type: object
      required:
      - subscriptionId
      - appId
      - eventType
      - targetUrl
      - createdAt
      properties:
        subscriptionId:
          type: string
        appId:
          type: string
        eventType:
          type: string
        targetUrl:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
    WebhookEvent:
      type: object
      required:
      - eventId
      - eventType
      - sessionId
      - payload
      - status
      - createdAt
      properties:
        eventId:
          type: string
        eventType:
          type: string
        sessionId:
          type: string
        payload:
          type: object
          additionalProperties: true
        status:
          type: string
          enum:
          - pending
          - delivered
          - failed
        createdAt:
          type: string
          format: date-time
    SwapQuote:
      type: object
      required:
      - amountOutEstimated
      - amountOutMin
      - slippageBps
      - routeTokens
      - encodedPath
      properties:
        amountOutEstimated:
          type: string
        amountOutMin:
          type: string
        slippageBps:
          type: integer
        routeTokens:
          type: array
          items:
            type: string
        encodedPath:
          type: string
          pattern: ^0x[a-fA-F0-9]+$
    SwapCreateRequest:
      type: object
      required:
      - tokenIn
      - tokenOut
      - amountIn
      - amountOutEstimated
      - amountOutMin
      - slippageBps
      - routeTokens
      - encodedPath
      - walletAddress
      properties:
        tokenIn:
          type: string
        tokenOut:
          type: string
        amountIn:
          type: string
        amountOutEstimated:
          type: string
        amountOutMin:
          type: string
        amountOutActual:
          type: string
        slippageBps:
          type: integer
        routeTokens:
          type: array
          items:
            type: string
        encodedPath:
          type: string
        walletAddress:
          $ref: '#/components/schemas/EvmAddress'
        txHash:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
    WithdrawalNetwork:
      type: string
      description: Target L1 network for the withdrawal.
      enum:
      - sepolia
      - amoy
      - besu
    WithdrawalTokenSymbol:
      type: string
      enum:
      - QNT
      - uUSD
      - uGBP
      - uEUR
      - uToken
    WithdrawalStatus:
      type: string
      description: Withdrawal lifecycle state (L2 rollup to L1).
      enum:
      - initiated
      - l2_confirmed
      - awaiting_dispute_game
      - provable
      - proven
      - awaiting_finalization
      - finalizable
      - finalized
      - proof_invalidated
      - failed
    CreateWithdrawalRequest:
      type: object
      required:
      - toNetwork
      - token
      - amount
      - fromAddress
      - toAddress
      properties:
        toNetwork:
          $ref: '#/components/schemas/WithdrawalNetwork'
        token:
          $ref: '#/components/schemas/WithdrawalTokenSymbol'
        amount:
          type: string
          description: Numeric string (digits with optional decimal); must be greater than zero.
          pattern: ^\d+(\.\d+)?$
          example: '100.5'
        fromAddress:
          $ref: '#/components/schemas/EvmAddress'
        toAddress:
          $ref: '#/components/schemas/EvmAddress'
        isNativeToErc20:
          type: boolean
          default: false
        l2TxHash:
          $ref: '#/components/schemas/TxHash'
        l2BlockNumber:
          type: integer
          minimum: 0
    WithdrawalRecord:
      type: object
      description: API projection of a withdrawal record.
      required:
      - id
      - userId
      - toNetwork
      - token
      - amount
      - fromAddress
      - toAddress
      - isNativeToErc20
      - status
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
        userId:
          type: string
        toNetwork:
          $ref: '#/components/schemas/WithdrawalNetwork'
        token:
          $ref: '#/components/schemas/WithdrawalTokenSymbol'
        amount:
          type: string
        fromAddress:
          $ref: '#/components/schemas/EvmAddress'
        toAddress:
          $ref: '#/components/schemas/EvmAddress'
        isNativeToErc20:
          type: boolean
        l2TxHash:
          $ref: '#/components/schemas/TxHash'
        l2BlockNumber:
          type: integer
        withdrawalHash:
          type: string
        withdrawalTx:
          type: object
          additionalProperties: true
        disputeGameIndex:
          type: integer
        outputRootProof:
          type: object
          additionalProperties: true
        withdrawalProof:
          type: array
          items:
            type: string
        proveTxHash:
          $ref: '#/components/schemas/TxHash'
        finalizeTxHash:
          $ref: '#/components/schemas/TxHash'
        status:
          $ref: '#/components/schemas/WithdrawalStatus'
        provableAt:
          type: string
          format: date-time
        finalizableAt:
          type: string
          format: date-time
        lastStatusCheckAt:
          type: string
          format: date-time
        failureReason:
          type: string
        completedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RecordProveTxRequest:
      type: object
      required:
      - proveTxHash
      properties:
        proveTxHash:
          $ref: '#/components/schemas/TxHash'
    RecordFinalizeTxRequest:
      type: object
      required:
      - finalizeTxHash
      properties:
        finalizeTxHash:
          $ref: '#/components/schemas/TxHash'
    ApiKeyScope:
      type: string
      description: A capability granted to an API key. Currently only `rpc` (full JSON-RPC access).
      enum:
      - rpc
      example: rpc
    CreateApiKeyRequest:
      type: object
      required:
      - label
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
          description: Human-readable name for the key, e.g. "CI key".
          example: CI key
        scopes:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ApiKeyScope'
          description: Scopes to grant. Defaults to `["rpc"]` when omitted.
          default:
          - rpc
        expiresAt:
          type: string
          format: date-time
          description: Optional ISO-8601 expiry. Must be in the future; absent = no expiry.
    MintedApiKey:
      type: object
      description: 'The result of minting a key. The `apiKey` field carries the full raw key

        (`fk_<keyId>.<secret>`) and is returned ONCE — it is unrecoverable

        afterwards.

        '
      required:
      - apiKey
      - keyId
      - label
      - scopes
      - createdAt
      properties:
        apiKey:
          type: string
          description: The full raw key — shown only once at creation.
          example: fk_abc123def456.s3cr3tValue...
        keyId:
          type: string
        label:
          type: string
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyScope'
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    ApiKeySummary:
      type: object
      description: A key's metadata — never includes the secret.
      required:
      - keyId
      - label
      - scopes
      - createdAt
      properties:
        keyId:
          type: string
          description: Public lookup handle — the first segment of the raw key.
        label:
          type: string
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyScope'
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          description: Timestamp of the last successful verification (throttled writes).
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
    TrackerSubscribeRequest:
      type: object
      required:
      - callbackUrl
      - networkId
      properties:
        callbackUrl:
          type: string
          format: uri
        networkId:
          type: string
    AddressSubscription:
      type: object
      required:
      - id
      - userId
      - address
      - networkId
      - callbackUrl
      - successful
      - createdAt
      properties:
        id:
          type: string
        userId:
          type: string
        address:
          $ref: '#/components/schemas/EvmAddress'
        networkId:
          type: string
        callbackUrl:
          type: string
          format: uri
        message:
          type: string
        successful:
          type: boolean
        createdAt:
          type: string
          format: date-time
    UnsubscribeResult:
      type: object
      required:
      - subscriptionId
      - message
      - successful
      properties:
        subscriptionId:
          type: string
        message:
          type: string
        successful:
          type: boolean
    TrackerEvent:
      type: object
      required:
      - id
      - networkId
      - type
      - payload
      - createdAt
      properties:
        id:
          type: string
        networkId:
          type: string
        targetAddress:
          $ref: '#/components/schemas/EvmAddress'
        contractAddress:
          $ref: '#/components/schemas/EvmAddress'
        type:
          type: string
        payload:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    EventSubscription:
      type: object
      required:
      - id
      - userId
      - contractAddress
      - eventName
      - eventParams
      - callbackUrl
      - networkId
      - successful
      - createdAt
      properties:
        id:
          type: string
        userId:
          type: string
        contractAddress:
          $ref: '#/components/schemas/EvmAddress'
        eventName:
          type: string
        eventParams:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              value:
                type: string
              indexed:
                type: boolean
        callbackUrl:
          type: string
          format: uri
        networkId:
          type: string
        successful:
          type: boolean
        createdAt:
          type: string
          format: date-time
  responses:
    Unauthorized:
      description: Unauthorized — missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    FlowBadRequest:
      description: Bad request (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:fusion:error:bad-request
            title: Bad Request
            status: 400
            detail: appId is required
            retryable: false
    FlowUnauthorized:
      description: Unauthorized (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:fusion:error:unauthorized
            title: Unauthorized
            status: 401
            detail: Invalid client credentials
            retryable: false
    FlowNotFound:
      description: Not found (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:fusion:error:not-found
            title: Not Found
            status: 404
            detail: Session not found
            retryable: false
    FlowTooManyRequests:
      description: Rate limit exceeded (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:fusion:error:too-many-requests
            title: Too Many Requests
            status: 429
            detail: Rate limit exceeded
            retryable: true
    FlowBadGateway:
      description: Flow App error, payment settlement failure, or content filter violation (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:fusion:error:bad-gateway
            title: Bad Gateway
            status: 502
            detail: Flow App returned invalid response
            retryable: true
    FlowGone:
      description: Session expired or already complete (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:fusion:error:gone
            title: Gone
            status: 410
            detail: Session has expired
            retryable: false
    FlowPaymentRequired:
      description: Payment required (x402)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/X402Descriptor'
      headers:
        X-Payment-Required:
          description: Base64-encoded JSON of the X402Descriptor
          schema:
            type: string
    FlowConflict:
      description: Conflict — state version mismatch or idempotency key collision (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:fusion:error:conflict
            title: Conflict
            status: 409
            detail: State version mismatch — expected 2, got 1
            retryable: true
  parameters:
    pageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    pageSizeParam:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        default: 10
    providerIdParam:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    contractAddressParam:
      name: contractAddress
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EvmAddress'
tags:
- name: Health
  description: Liveness and readiness probes
- name: Observability
  description: Prometheus metrics
- name: RPC
  description: JSON-RPC proxy to the Fusion L2 (OP-Geth) **only**. For JSON-RPC against any other connected chain, use the Fusion Proxy's multi-DLT endpoint `/dlts/{dlt}/networks/{networkId}/rpc/{apiKey}` (see the fusion-proxy spec).
- name: User
  description: Authenticated user profile and resource data
- name: Deposits
  description: Token deposit management
- name: Contracts
  description: Deployed smart contract registry and permissions
- name: Stakes
  description: Staking operations
- name: Nodes
  description: DLT node management
- name: Networks
  description: Network discovery
- name: Flow Sessions
  description: Multi-step Flow App session management
- name: Flow Registry
  description: Available Flow App definitions
- name: Flow Query
  description: Read-only state queries against Flow Apps
- name: Flow Webhooks
  description: Outbound webhook subscriptions and event replay
- name: Swaps
  description: Token swap quotes and execution
- name: Withdrawals
  description: L2-to-L1 withdrawal lifecycle (initiate, prove, finalize)
- name: API Keys
  description: Self-service management of Overledger-issued API keys
- name: Tracker Address
  description: Subscribe to events emitted from / to an address
- name: Tracker Event
  description: Subscribe to a specific contract event signature
- name: Tracker Transaction
  description: Track a transaction's confirmation status with callback notifications
x-provenance:
  method: searched
  source: https://docs.overledger.dev/reference
  harvested: '2026-10-14'
