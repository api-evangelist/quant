  /rpc/{apiKey}:
    post:
      tags:
      - RPC
      summary: Fusion L2 JSON-RPC
      description: 'Proxies a JSON-RPC 2.0 request to the Fusion L2 OP-Geth node.

        This route is for the Fusion L2 only. Only Fusion L2 methods are supported —

        JSON-RPC for any other connected chain must go to the Fusion Proxy''s multi-DLT

        endpoint `/dlts/{dlt}/networks/{networkId}/rpc/{apiKey}` (see the fusion-proxy spec).


        Authentication is accepted via the Overledger-issued API key as the

        `{apiKey}` path segment, the `X-API-Key` header, or an

        `Authorization: Bearer <jwt>` Keycloak token. The `X-API-Key` header

        takes precedence over the others when present.

        '
      security:
      - apiKeyAuth: []
      - bearerAuth: []
      parameters:
      - name: apiKey
        in: path
        required: true
        description: 'An Overledger-issued API key (`fk_<keyId>.<secret>`) used to

          authenticate the request.

          '
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
            examples:
              blockNumber:
                summary: Get latest block number
                value:
                  jsonrpc: '2.0'
                  method: eth_blockNumber
                  id: 1
                  params: []
              getBalance:
                summary: Get ETH balance
                value:
                  jsonrpc: '2.0'
                  method: eth_getBalance
                  id: 2
                  params:
                  - '0xAbCd1234AbCd1234AbCd1234AbCd1234AbCd1234'
                  - latest
      responses:
        '200':
          description: JSON-RPC response (success or RPC-level error)
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/JsonRpcResponse'
                - $ref: '#/components/schemas/JsonRpcError'
        '401':
          description: Missing credentials (JSON-RPC error code `-32000`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcError'
        '403':
          description: Invalid credentials (JSON-RPC error code `-32001`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcError'
        '503':
          description: OP-Geth node unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcError'
