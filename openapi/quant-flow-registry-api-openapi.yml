openapi: 3.2.0
info:
  title: Overledger Server Flow Registry API
  description: The Overledger Server is the primary client-facing gateway.
  version: 1.0.0
servers:
- url: https://fusion-rollup.quant.dev
  description: Testnet (live) — the public Fusion Server endpoint
- url: http://localhost:8080
  description: Local development
security:
- bearerAuth: []
- apiKeyAuth: []
tags:
- name: Flow Registry
  description: Available Flow App definitions
paths:
  /flow/registry/apps:
    get:
      tags:
      - Flow Registry
      operationId: listApps
      summary: List available Flow Apps
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Paginated app list
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FlowAppSummary'
                  pagination:
                    $ref: '#/components/schemas/FlowPaginationMeta'
        '401':
          $ref: '#/components/responses/FlowUnauthorized'
  /flow/registry/apps/components:
    get:
      tags:
      - Flow Registry
      operationId: getAllowedComponents
      summary: List allowed UI component types
      description: Returns the catalogue of allowed template types, field types, and action types.
      responses:
        '200':
          description: Allowed component catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowedComponents'
        '401':
          $ref: '#/components/responses/FlowUnauthorized'
  /flow/registry/apps/{appId}:
    get:
      tags:
      - Flow Registry
      operationId: getApp
      summary: Get a Flow App's details and versions
      parameters:
      - name: appId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: App detail with version history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowAppDetail'
        '401':
          $ref: '#/components/responses/FlowUnauthorized'
        '404':
          $ref: '#/components/responses/FlowNotFound'
components:
  schemas:
    ProblemDetails:
      type: object
      description: RFC 7807 Problem Details — used by all /flow/* endpoints
      required:
      - type
      - title
      - status
      - detail
      - retryable
      properties:
        type:
          type: string
          description: Error classification URI
          example: urn:fusion:error:bad-request
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: appId is required
        retryable:
          type: boolean
          description: Whether the client should retry this request
        instance:
          type: string
          description: Request ID for correlation
    AllowedComponents:
      type: object
      required:
      - templates
      - fieldTypes
      - actionTypes
      properties:
        templates:
          type: array
          items:
            type: string
          example:
          - form
          - review
          - info
          - document
        fieldTypes:
          type: array
          items:
            type: string
          example:
          - text-input
          - text-area
          - number
          - currency
          - select
          - checkbox
          - date
          - radio-group
          - display
          - table
          - wallet
        actionTypes:
          type: array
          items:
            type: string
          example:
          - submit
    HypermediaLinks:
      type: object
      properties:
        self:
          type: string
        submit:
          type: string
    FlowPaginationMeta:
      type: object
      required:
      - hasMore
      - totalCount
      properties:
        nextCursor:
          type: string
        hasMore:
          type: boolean
        totalCount:
          type: integer
    AppVisibility:
      type: string
      enum:
      - public
      - permissioned
      - private
    VersionStatus:
      type: string
      enum:
      - active
      - deprecated
      - retired
    FlowAppDetail:
      type: object
      required:
      - appId
      - displayName
      - description
      - publisher
      - visibility
      - categories
      - versions
      - createdAt
      - updatedAt
      properties:
        appId:
          type: string
        displayName:
          type: string
        description:
          type: string
        publisher:
          type: string
        visibility:
          $ref: '#/components/schemas/AppVisibility'
        categories:
          type: array
          items:
            type: string
        versions:
          type: array
          items:
            type: object
            required:
            - version
            - status
            - appType
            - createdAt
            - updatedAt
            properties:
              version:
                type: string
              status:
                $ref: '#/components/schemas/VersionStatus'
              appType:
                $ref: '#/components/schemas/AppType'
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        _links:
          $ref: '#/components/schemas/HypermediaLinks'
    AppType:
      type: string
      enum:
      - internal
      - external
    FlowAppSummary:
      type: object
      required:
      - appId
      - displayName
      - description
      - publisher
      - visibility
      - categories
      - activeVersionCount
      - createdAt
      - updatedAt
      properties:
        appId:
          type: string
        displayName:
          type: string
        description:
          type: string
        publisher:
          type: string
        visibility:
          $ref: '#/components/schemas/AppVisibility'
        categories:
          type: array
          items:
            type: string
        activeVersionCount:
          type: integer
        latestVersion:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        _links:
          $ref: '#/components/schemas/HypermediaLinks'
  responses:
    FlowUnauthorized:
      description: Unauthorized (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:fusion:error:unauthorized
            title: Unauthorized
            status: 401
            detail: Invalid client credentials
            retryable: false
    FlowNotFound:
      description: Not found (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:fusion:error:not-found
            title: Not Found
            status: 404
            detail: Session not found
            retryable: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'A Keycloak access token (JWT), verified against the realm JWKS

        (signature / issuer / expiry). The caller''s identity is the token''s

        `sub` claim — this is **not** a `clientId`.

        '
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'An Overledger-issued API key of the form `fk_<keyId>.<secret>`, minted via

        `POST /users/me/api-keys`. Accepted on any route and **takes precedence**

        over the `Authorization` header when both are supplied. Resolves to the

        same identity (Keycloak `sub`) as the equivalent Bearer JWT.

        '
