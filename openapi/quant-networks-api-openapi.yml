openapi: 3.2.0
info:
  title: Overledger Server Networks API
  description: The Overledger Server is the primary client-facing gateway.
  version: 1.0.0
servers:
- url: https://fusion-rollup.quant.dev
  description: Testnet (live) — the public Fusion Server endpoint
- url: http://localhost:8080
  description: Local development
security:
- bearerAuth: []
- apiKeyAuth: []
tags:
- name: Networks
  description: Network discovery
paths:
  /networks:
    get:
      tags:
      - Networks
      summary: List all networks
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          default: 100
      responses:
        '200':
          description: Paginated networks
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginatedMeta'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Network'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: getNetworks
      x-operation-id-source: derived
  /networks/fusion:
    get:
      tags:
      - Networks
      summary: List Fusion Rollup connected networks
      responses:
        '200':
          description: Fusion networks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Network'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: getNetworksFusion
      x-operation-id-source: derived
  /networks/total:
    get:
      tags:
      - Networks
      summary: Get total network count
      responses:
        '200':
          description: Total count
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: getNetworksTotal
      x-operation-id-source: derived
components:
  schemas:
    DltType:
      type: string
      enum:
      - EVM
      - HEDERA
      - SOLANA
      - SUI
      - APTOS
      - COSMOS
    PaginatedMeta:
      type: object
      required:
      - total
      - page
      - pageSize
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        hasMore:
          type: boolean
    StandardError:
      type: object
      required:
      - timestamp
      - status
      - error
      - message
      - path
      properties:
        timestamp:
          type: integer
          description: Milliseconds since epoch
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
      example:
        timestamp: 1709737845000
        status: 400
        error: Bad request
        message: Validation failed
        path: /users/me/deposits
    Network:
      type: object
      required:
      - networkId
      - name
      - type
      - isFusion
      - createdAt
      - updatedAt
      properties:
        _id:
          type: string
        networkId:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/DltType'
        environment:
          type: string
          enum:
          - mainnet
          - testnet
          - devnet
        visibility:
          type: string
          enum:
          - public
          - permissioned
          - private
        status:
          type: string
          enum:
          - active
          - paused
          - deprecated
        capacity:
          type: string
          enum:
          - PROVISIONED
          - ENHANCED
          - SCALED
        isFusion:
          type: boolean
        rpc:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
  parameters:
    pageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
  responses:
    Unauthorized:
      description: Unauthorized — missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'A Keycloak access token (JWT), verified against the realm JWKS

        (signature / issuer / expiry). The caller''s identity is the token''s

        `sub` claim — this is **not** a `clientId`.

        '
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'An Overledger-issued API key of the form `fk_<keyId>.<secret>`, minted via

        `POST /users/me/api-keys`. Accepted on any route and **takes precedence**

        over the `Authorization` header when both are supplied. Resolves to the

        same identity (Keycloak `sub`) as the equivalent Bearer JWT.

        '
