openapi: 3.2.0
info:
  title: Overledger Server Tracker Address API
  description: The Overledger Server is the primary client-facing gateway.
  version: 1.0.0
servers:
- url: https://fusion-rollup.quant.dev
  description: Testnet (live) — the public Fusion Server endpoint
- url: http://localhost:8080
  description: Local development
security:
- bearerAuth: []
- apiKeyAuth: []
tags:
- name: Tracker Address
  description: Subscribe to events emitted from / to an address
paths:
  /accounts/subscribe/{address}:
    post:
      tags:
      - Tracker Address
      operationId: subscribeAddress
      summary: Subscribe to events involving an address
      parameters:
      - name: address
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EvmAddress'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackerSubscribeRequest'
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressSubscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /accounts/unsubscribe/{subscriptionId}:
    delete:
      tags:
      - Tracker Address
      operationId: unsubscribeAddress
      summary: Cancel an address subscription
      parameters:
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
      responses:
        '200':
          description: Unsubscribed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsubscribeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /accounts/{address}/events:
    get:
      tags:
      - Tracker Address
      operationId: listAddressEvents
      summary: List recorded events for an address
      parameters:
      - name: address
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EvmAddress'
      - name: networkId
        in: query
        schema:
          type: string
      - name: since
        in: query
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      responses:
        '200':
          description: Address events
          content:
            application/json:
              schema:
                type: object
                required:
                - address
                - count
                - data
                properties:
                  address:
                    $ref: '#/components/schemas/EvmAddress'
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrackerEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    TrackerSubscribeRequest:
      type: object
      required:
      - callbackUrl
      - networkId
      properties:
        callbackUrl:
          type: string
          format: uri
        networkId:
          type: string
    UnsubscribeResult:
      type: object
      required:
      - subscriptionId
      - message
      - successful
      properties:
        subscriptionId:
          type: string
        message:
          type: string
        successful:
          type: boolean
    EvmAddress:
      type: string
      pattern: ^0x[a-fA-F0-9]{40}$
      example: '0xAbCd1234AbCd1234AbCd1234AbCd1234AbCd1234'
    StandardError:
      type: object
      required:
      - timestamp
      - status
      - error
      - message
      - path
      properties:
        timestamp:
          type: integer
          description: Milliseconds since epoch
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
      example:
        timestamp: 1709737845000
        status: 400
        error: Bad request
        message: Validation failed
        path: /users/me/deposits
    TrackerEvent:
      type: object
      required:
      - id
      - networkId
      - type
      - payload
      - createdAt
      properties:
        id:
          type: string
        networkId:
          type: string
        targetAddress:
          $ref: '#/components/schemas/EvmAddress'
        contractAddress:
          $ref: '#/components/schemas/EvmAddress'
        type:
          type: string
        payload:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    AddressSubscription:
      type: object
      required:
      - id
      - userId
      - address
      - networkId
      - callbackUrl
      - successful
      - createdAt
      properties:
        id:
          type: string
        userId:
          type: string
        address:
          $ref: '#/components/schemas/EvmAddress'
        networkId:
          type: string
        callbackUrl:
          type: string
          format: uri
        message:
          type: string
        successful:
          type: boolean
        createdAt:
          type: string
          format: date-time
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    Unauthorized:
      description: Unauthorized — missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'A Keycloak access token (JWT), verified against the realm JWKS

        (signature / issuer / expiry). The caller''s identity is the token''s

        `sub` claim — this is **not** a `clientId`.

        '
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'An Overledger-issued API key of the form `fk_<keyId>.<secret>`, minted via

        `POST /users/me/api-keys`. Accepted on any route and **takes precedence**

        over the `Authorization` header when both are supplied. Resolves to the

        same identity (Keycloak `sub`) as the equivalent Bearer JWT.

        '
