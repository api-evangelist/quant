openapi: 3.2.0
info:
  title: Overledger Server Swaps API
  description: The Overledger Server is the primary client-facing gateway.
  version: 1.0.0
servers:
- url: https://fusion-rollup.quant.dev
  description: Testnet (live) — the public Fusion Server endpoint
- url: http://localhost:8080
  description: Local development
security:
- bearerAuth: []
- apiKeyAuth: []
tags:
- name: Swaps
  description: Token swap quotes and execution
paths:
  /swaps:
    post:
      tags:
      - Swaps
      operationId: createSwap
      summary: Record an executed swap transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwapCreateRequest'
      responses:
        '201':
          description: Swap recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Swap'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /swaps/quote:
    post:
      tags:
      - Swaps
      operationId: getSwapQuote
      summary: Get a swap quote (no on-chain effect)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tokenIn
              - tokenOut
              - amountIn
              properties:
                tokenIn:
                  type: string
                tokenOut:
                  type: string
                amountIn:
                  type: string
                slippageBps:
                  type: integer
                  minimum: 1
                  maximum: 2000
                  default: 50
      responses:
        '200':
          description: Quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapQuote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /swaps/tokens:
    get:
      tags:
      - Swaps
      operationId: getSupportedSwapTokens
      summary: List supported swap tokens + their metadata
      responses:
        '200':
          description: Token catalogue
          content:
            application/json:
              schema:
                type: object
                required:
                - tokens
                - tokenConfig
                properties:
                  tokens:
                    type: array
                    items:
                      type: string
                  tokenConfig:
                    type: object
                    additionalProperties:
                      type: object
                      required:
                      - address
                      - decimals
                      - isNative
                      properties:
                        address:
                          $ref: '#/components/schemas/EvmAddress'
                        decimals:
                          type: integer
                        isNative:
                          type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
  /swaps/{id}:
    get:
      tags:
      - Swaps
      operationId: getSwap
      summary: Get a swap by ID
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Swap detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Swap'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /swaps/{id}/status:
    get:
      tags:
      - Swaps
      operationId: checkSwapStatus
      summary: Refresh + return a swap's on-chain status
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Latest status snapshot
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - status
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    enum:
                    - initiated
                    - completed
                    - failed
                    - unknown
                  txHash:
                    type: string
                  amountOutActual:
                    type: string
                  failureReason:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    SwapQuote:
      type: object
      required:
      - amountOutEstimated
      - amountOutMin
      - slippageBps
      - routeTokens
      - encodedPath
      properties:
        amountOutEstimated:
          type: string
        amountOutMin:
          type: string
        slippageBps:
          type: integer
        routeTokens:
          type: array
          items:
            type: string
        encodedPath:
          type: string
          pattern: ^0x[a-fA-F0-9]+$
    EvmAddress:
      type: string
      pattern: ^0x[a-fA-F0-9]{40}$
      example: '0xAbCd1234AbCd1234AbCd1234AbCd1234AbCd1234'
    StandardError:
      type: object
      required:
      - timestamp
      - status
      - error
      - message
      - path
      properties:
        timestamp:
          type: integer
          description: Milliseconds since epoch
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
      example:
        timestamp: 1709737845000
        status: 400
        error: Bad request
        message: Validation failed
        path: /users/me/deposits
    Swap:
      type: object
      required:
      - id
      - userId
      - tokenIn
      - tokenOut
      - amountIn
      - amountOutEstimated
      - amountOutMin
      - slippageBps
      - routeTokens
      - encodedPath
      - walletAddress
      - status
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
        userId:
          type: string
        tokenIn:
          type: string
        tokenOut:
          type: string
        amountIn:
          type: string
        amountOutEstimated:
          type: string
        amountOutMin:
          type: string
        amountOutActual:
          type: string
        slippageBps:
          type: integer
        routeTokens:
          type: array
          items:
            type: string
        encodedPath:
          type: string
        walletAddress:
          $ref: '#/components/schemas/EvmAddress'
        txHash:
          type: string
        status:
          type: string
          enum:
          - initiated
          - completed
          - failed
          - unknown
        failureReason:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SwapCreateRequest:
      type: object
      required:
      - tokenIn
      - tokenOut
      - amountIn
      - amountOutEstimated
      - amountOutMin
      - slippageBps
      - routeTokens
      - encodedPath
      - walletAddress
      properties:
        tokenIn:
          type: string
        tokenOut:
          type: string
        amountIn:
          type: string
        amountOutEstimated:
          type: string
        amountOutMin:
          type: string
        amountOutActual:
          type: string
        slippageBps:
          type: integer
        routeTokens:
          type: array
          items:
            type: string
        encodedPath:
          type: string
        walletAddress:
          $ref: '#/components/schemas/EvmAddress'
        txHash:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    Unauthorized:
      description: Unauthorized — missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'A Keycloak access token (JWT), verified against the realm JWKS

        (signature / issuer / expiry). The caller''s identity is the token''s

        `sub` claim — this is **not** a `clientId`.

        '
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'An Overledger-issued API key of the form `fk_<keyId>.<secret>`, minted via

        `POST /users/me/api-keys`. Accepted on any route and **takes precedence**

        over the `Authorization` header when both are supplied. Resolves to the

        same identity (Keycloak `sub`) as the equivalent Bearer JWT.

        '
