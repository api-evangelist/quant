openapi: 3.2.0
info:
  title: Overledger Server Tracker Event API
  description: The Overledger Server is the primary client-facing gateway.
  version: 1.0.0
servers:
- url: https://fusion-rollup.quant.dev
  description: Testnet (live) — the public Fusion Server endpoint
- url: http://localhost:8080
  description: Local development
security:
- bearerAuth: []
- apiKeyAuth: []
tags:
- name: Tracker Event
  description: Subscribe to a specific contract event signature
paths:
  /events/subscribe:
    post:
      tags:
      - Tracker Event
      operationId: subscribeEvent
      summary: Subscribe to a specific contract event signature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - contractAddress
              - eventName
              - eventParams
              - callbackUrl
              - networkId
              properties:
                contractAddress:
                  $ref: '#/components/schemas/EvmAddress'
                eventName:
                  type: string
                eventParams:
                  type: array
                  items:
                    type: object
                    required:
                    - type
                    properties:
                      type:
                        type: string
                      value:
                        type: string
                      indexed:
                        type: boolean
                callbackUrl:
                  type: string
                  format: uri
                networkId:
                  type: string
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSubscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /events/subscriptions/{subscriptionId}/events:
    get:
      tags:
      - Tracker Event
      operationId: listEventSubscriptionEvents
      summary: List recorded events for a contract-event subscription
      parameters:
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
      - name: networkId
        in: query
        schema:
          type: string
      - name: since
        in: query
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      responses:
        '200':
          description: Subscription events
          content:
            application/json:
              schema:
                type: object
                required:
                - subscriptionId
                - count
                - data
                properties:
                  subscriptionId:
                    type: string
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrackerEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /events/unsubscribe/{subscriptionId}:
    delete:
      tags:
      - Tracker Event
      operationId: unsubscribeEvent
      summary: Cancel a contract-event subscription
      parameters:
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
      responses:
        '200':
          description: Unsubscribed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsubscribeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    UnsubscribeResult:
      type: object
      required:
      - subscriptionId
      - message
      - successful
      properties:
        subscriptionId:
          type: string
        message:
          type: string
        successful:
          type: boolean
    EvmAddress:
      type: string
      pattern: ^0x[a-fA-F0-9]{40}$
      example: '0xAbCd1234AbCd1234AbCd1234AbCd1234AbCd1234'
    StandardError:
      type: object
      required:
      - timestamp
      - status
      - error
      - message
      - path
      properties:
        timestamp:
          type: integer
          description: Milliseconds since epoch
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
      example:
        timestamp: 1709737845000
        status: 400
        error: Bad request
        message: Validation failed
        path: /users/me/deposits
    TrackerEvent:
      type: object
      required:
      - id
      - networkId
      - type
      - payload
      - createdAt
      properties:
        id:
          type: string
        networkId:
          type: string
        targetAddress:
          $ref: '#/components/schemas/EvmAddress'
        contractAddress:
          $ref: '#/components/schemas/EvmAddress'
        type:
          type: string
        payload:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    EventSubscription:
      type: object
      required:
      - id
      - userId
      - contractAddress
      - eventName
      - eventParams
      - callbackUrl
      - networkId
      - successful
      - createdAt
      properties:
        id:
          type: string
        userId:
          type: string
        contractAddress:
          $ref: '#/components/schemas/EvmAddress'
        eventName:
          type: string
        eventParams:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              value:
                type: string
              indexed:
                type: boolean
        callbackUrl:
          type: string
          format: uri
        networkId:
          type: string
        successful:
          type: boolean
        createdAt:
          type: string
          format: date-time
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    Unauthorized:
      description: Unauthorized — missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'A Keycloak access token (JWT), verified against the realm JWKS

        (signature / issuer / expiry). The caller''s identity is the token''s

        `sub` claim — this is **not** a `clientId`.

        '
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'An Overledger-issued API key of the form `fk_<keyId>.<secret>`, minted via

        `POST /users/me/api-keys`. Accepted on any route and **takes precedence**

        over the `Authorization` header when both are supplied. Resolves to the

        same identity (Keycloak `sub`) as the equivalent Bearer JWT.

        '
